version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      npm-versions:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Los_Angeles
    groups:
      action-versions:
        patterns: ["*"]

appId: com.ozeitis.switchboard
productName: Switchboard
copyright: Copyright © 2026 Oze
directories:
  output: release
files:
  - dist/**
  - LICENSE
  - THIRD_PARTY.md
asar: true
asarUnpack:
  - dist/native/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
artifactName: Switchboard-${version}-${arch}.${ext}
mac:
  category: public.app-category.business
  icon: assets/icon.icns
  identity: '-'
  hardenedRuntime: true
  notarize: false
  entitlements: assets/entitlements.plist
  entitlementsInherit: assets/entitlements.plist
  extendInfo:
    NSMicrophoneUsageDescription: Use your microphone for Quo calls and local audio tests.
  target:
    - dmg
    - zip
dmg:
  title: Switchboard
  contents:
    - x: 150
      y: 160
    - x: 430
      y: 160
      type: link
      path: /Applications
publish: null
